server:
  port: 9000
  netty:
    connection-timeout: 2s
    idle-timeout: 15s

spring:
  application:
    name: edge-service
  lifecycle: # `server.shutdown` is a `graceful` value by default
    timeout-per-shutdown-phase: 15s # 30s is default
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: catalog-route
              uri: ${CATALOG_SERVICE_URI:http://localhost:9001}/books
              predicates:
                - Path=/books/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: catalogCircuitBreaker
                    fallbackUri: forward:/catalog-fallback
            - id: order-route
              uri: ${ORDER_SERVICE_URI:http://localhost:9002}/orders
              predicates:
                - Path=/orders/**
              filters:
                - name: CircuitBreaker
                  args:
                    name: orderCircuitBreaker
          httpclient:
            connect-timeout: ${GATEWAY_CONNECT_TIMEOUT:2000}
            response-timeout: ${GATEWAY_RESPONSE_TIMEOUT:5s}
            pool:
              type: elastic
              max-idle-time: 15s
              max-life-time: 60s
          default-filters:
            - name: RequestRateLimiter
              args:
                redis-rate-limiter:
                  replenishRate: ${RATE_LIMITER_REPLENISH_RATE:10}
                  burstCapacity: ${RATE_LIMITER_BURST_CAPACITY:20}
                  requestedTokens: 1
            - name: Retry
              args:
                retries: 3
                methods: GET
                series: SERVER_ERROR
                exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: ${RETRY_FIRST_BACKOFF:50ms}
                  maxBackoff: ${RETRY_MAX_BACKOFF:500ms}
                  factor: 2
                  basedOnPreviousValue: false
                jitter:
                  randomFactor: 0.5
  data:
    redis:
      connect-timeout: 2s
      host: localhost
      port: 6379
      timeout: 1s

resilience4j:
  circuitbreaker:
    configs:
      default:
        sliding-window-size: 20
        permitted-number-of-calls-in-half-open-state: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 15s
  timelimiter:
    configs:
      default:
        timeout-duration: ${TIME_LIMITER_DEFAULT_TIMEOUT:5s}

logging:
  level:
    io.github.resilience4j: DEBUG
