server:
  port: 9000
  netty:
    connection-timeout: 2s
    idle-timeout: 15s

spring:
  application:
    name: edge-service
  lifecycle: # `server.shutdown` is a `graceful` value by default
    timeout-per-shutdown-phase: 15s # 30s is default
  cloud:
    gateway:
      routes:
        - id: catalog-route
          uri: ${CATALOG_SERVICE_URI:http://localhost:9001}/books
          predicates:
            - Path=/books/**
        - id: order-route
          uri: ${ORDER_SERVICE_URI:http://localhost:9002}/orders
          predicates:
            - Path=/orders/**
