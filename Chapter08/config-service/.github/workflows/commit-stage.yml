name: Commit Stage
on: push

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: fresult-polarbookshop/config-service
  VERSION: latest

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26
          cache: gradle
      - name: Build, unit tests, and integration tests
        run: |
          chmod +x gradlew
          ./gradlew build
      - name: Code vulnerability report
        id: source_scan_report
        uses: anchore/scan-action@v7
        with:
          path: ${{ github.workspace }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          cache-db: true
      - name: Upload source vulnerability report
        if: ${{ always() && steps.source_scan_report.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.source_scan_report.outputs.sarif }}
      - name: Enforce source vulnerability threshold
        if: ${{ always() }}
        uses: anchore/scan-action@v7
        with:
          path: ${{ github.workspace }}
          fail-build: true
          severity-cutoff: high
          output-format: table
          cache-db: true
      - name: Setup tools
        uses: alexellis/setup-arkade@v4
      - name: Install tools
        uses: alexellis/arkade-get@master
        with:
          kubeconform: latest
      - name: Validate Kubernetes manifests
        run: |
          kubeconform --strict --summary --verbose k8s
  package:
    name: Package and Publish
    if: ${{ github.ref == 'refs/heads/main' }}
    needs:
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - name: Checkout source code
        uses: actions/checkout@v7
      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 26
          cache: gradle
      - name: Build container image
        run: |
          chmod +x gradlew
          ./gradlew bootBuildImage \
            --imageName ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
      - name: OCI image vulnerability report
        id: image_scan_report
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          fail-build: false
          severity-cutoff: high
          output-format: sarif
          cache-db: true
      - name: Upload image vulnerability report
        if: ${{ always() && steps.image_scan_report.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.image_scan_report.outputs.sarif }}
      - name: Enforce image vulnerability threshold
        uses: anchore/scan-action@v7
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
          fail-build: true
          severity-cutoff: high
          output-format: table
          cache-db: true
      - name: Log into container registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish container image
        run: docker push ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.VERSION }}
